<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogopines</title>

<style>
/* =====================================================
   COLORES  ->  cambia solo estos valores para probar otra paleta.
   ===================================================== */
:root {
  --fondo:       #FBF6EE;  /* fondo de la página */
  --cabecera:    #FBE9D0;  /* franja de arriba */
  --tarjeta:     #FFFFFF;  /* fondo de cada artículo */
  --texto:       #3A3350;  /* texto principal */
  --texto-suave: #7B7490;  /* texto secundario */
  --acento:      #8A3B4E;  /* botones y precios */
  --borde:       #EBDFD2;  /* líneas finas */
  /* 5 pasteles que se turnan como fondo de las fotos y las etiquetas */
  --p1: #FFD9E2;  --p2: #D5F0E3;  --p3: #FFE9C7;  --p4: #D4E6FA;  --p5: #E6DCF7;
}

* { box-sizing: border-box; margin: 0; }
body {
  background: var(--fondo);
  color: var(--texto);
  font-family: ui-rounded, "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
  line-height: 1.5;
}

/* Cabecera */
header { background: var(--cabecera); text-align: center; padding: 36px 16px 28px; }
header img { height: 150px; width: auto; max-width: 80%; }
header h1 { font-size: 2.4rem; }
header .lineas { margin-top: 8px; }
header .lineas p { color: var(--texto-suave); }
header .lineas p:first-child { color: var(--texto); font-weight: 700; font-size: 1.1rem; }
.enlaces { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.enlaces a {
  background: var(--tarjeta); color: var(--acento); text-decoration: none;
  font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--borde);
}
.enlaces a:hover, .enlaces a:focus-visible { background: var(--acento); color: #fff; outline: none; }

/* Filtros por categoría */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 1180px; margin: 28px auto 8px; padding: 0 16px; }
.filtros button {
  font: inherit; font-weight: 600; color: var(--texto); cursor: pointer;
  border: 1px solid var(--borde); background: var(--tarjeta);
  padding: 6px 16px; border-radius: 999px;
}
.filtros button.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
.filtros button:focus-visible { outline: 3px solid var(--borde); outline-offset: 2px; }

/* Cuadrícula: 5 columnas, y menos en pantallas chicas */
.cuadricula {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 32px 28px;
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 16px 56px;
}
@media (max-width: 1000px) { .cuadricula { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 780px)  { .cuadricula { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 18px; } }
@media (max-width: 520px)  { .cuadricula { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; } }

.vacio { grid-column: 1 / -1; text-align: center; color: var(--texto-suave); }

.articulo {
  background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px;
  padding: 10px 10px 14px; text-align: left; font: inherit; color: inherit; cursor: pointer;
  transition: transform .15s, border-color .15s;
}
.articulo:hover, .articulo:focus-visible { transform: translateY(-3px); border-color: var(--acento); outline: none; }
.articulo.sin-stock { opacity: .6; }
.articulo .nombre { margin-top: 10px; font-weight: 700; font-size: .95rem; line-height: 1.3; }
.articulo .fila { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; }
.precio { color: var(--acento); font-weight: 700; }

.foto {
  aspect-ratio: 1 / 1; width: 100%; border-radius: 12px; overflow: hidden;
  display: grid; place-items: center; font-size: 2.6rem;
}
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }

.estado { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.estado.disp    { background: var(--p2); color: #2F6B50; }
.estado.pocas   { background: var(--p3); color: #8A5A12; }
.estado.agotado { background: var(--p1); color: #9A3F5B; }

/* Ventana de detalle */
dialog {
  border: none; border-radius: 20px; padding: 0; margin: auto;
  width: min(440px, 92vw); background: var(--tarjeta); color: var(--texto);
}
dialog::backdrop { background: rgba(58, 51, 80, .5); }
.detalle { padding: 16px 16px 22px; }
.detalle .foto { font-size: 4.5rem; }
.detalle .meta { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
.detalle .cat { font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--p5); }
.detalle h2 { margin-top: 6px; font-size: 1.35rem; }
.detalle .precio { font-size: 1.2rem; margin: 2px 0 8px; }
.detalle p { color: var(--texto-suave); }
.acciones { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
.cantidad { display: flex; align-items: center; gap: 4px; border: 1px solid var(--borde); border-radius: 10px; }
.cantidad button { font: inherit; font-size: 1.2rem; width: 34px; height: 38px; border: none; background: none; color: var(--acento); cursor: pointer; }
.cantidad span { min-width: 24px; text-align: center; font-weight: 700; }
.pedir {
  flex: 1; text-align: center; text-decoration: none; background: var(--acento); color: #fff;
  font-weight: 700; padding: 10px; border-radius: 10px;
}
.cerrar {
  margin-top: 12px; width: 100%; font: inherit; font-weight: 600; cursor: pointer;
  background: none; border: 1px solid var(--borde); color: var(--texto-suave); border-radius: 10px; padding: 8px;
}

.medidas { margin-top: 8px; font-size: .9rem; color: var(--texto-suave); }
.broche { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 12px; background: var(--fondo); }
.broche label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.broche input[type=checkbox] { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--acento); }
.broche small { color: var(--texto-suave); }
.broche .estado { display: inline-block; margin: 8px 0 0 28px; }
.broche.off { opacity: .7; }
.broche.off label { cursor: not-allowed; }
.cantb { display: flex; align-items: center; gap: 10px; margin: 10px 0 0 28px; font-size: .9rem; }
.encargo { margin-top: 16px; padding: 12px 14px; border: 1px dashed var(--acento); border-radius: 12px; background: var(--fondo); }
.encargo p { margin-top: 4px; font-size: .92rem; }
.desglose { margin-top: 14px; font-size: .9rem; color: var(--texto-suave); }
.desglose div { display: flex; justify-content: space-between; gap: 12px; }
.total { margin-top: 14px; font-weight: 700; }

dialog { max-height: 92vh; overflow-y: auto; }
.articulo .sub { font-size: .78rem; color: var(--texto-suave); margin-top: 2px; }
.acciones span { font-weight: 600; }

/* Packs: elegir pin por pin */
.piezas-tit { margin-top: 16px; font-weight: 700; }
.piezas { display: grid; gap: 8px; margin-top: 8px; }
.pieza { display: grid; grid-template-columns: auto 56px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px;
  border: 1px solid var(--borde); border-radius: 12px; cursor: pointer; background: var(--tarjeta); transition: box-shadow .15s, background .15s; }
.pieza input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--acento); }
.pieza.sel { box-shadow: inset 0 0 0 2px var(--acento); background: var(--fondo); }
.pieza.off { opacity: .5; cursor: not-allowed; }
.pz-img { position: relative; width: 56px; height: 56px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; font-size: 1.6rem; }
.pz-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pz-img img, .pz-img .emo { transition: filter .2s; }
.pz-img .visto { position: absolute; inset: 0; display: none; place-items: center; background: rgba(138, 59, 78, .28); color: #fff; font-style: normal; font-size: 1.4rem; font-weight: 700; }
.pieza.sel .pz-img .visto { display: grid; }
.efecto-elegidos .pieza.sel .pz-img img, .efecto-elegidos .pieza.sel .pz-img .emo { filter: blur(1.5px); }
.efecto-otros.hay-sel .pieza:not(.sel):not(.off) .pz-img img, .efecto-otros.hay-sel .pieza:not(.sel):not(.off) .pz-img .emo { filter: blur(1.5px); }
.pz-datos b { display: block; font-size: .92rem; line-height: 1.25; }
.pz-datos small { display: block; color: var(--texto-suave); }
.pz-precio { font-weight: 700; color: var(--acento); font-size: .9rem; }
.todos { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-weight: 700; cursor: pointer; }
.todos input { width: 20px; height: 20px; accent-color: var(--acento); }

/* Botones de compra */
.acciones-col { display: grid; gap: 8px; margin-top: 14px; }
.btn-add { background: var(--acento); color: #fff; border: none; border-radius: 10px; padding: 11px; font: inherit; font-weight: 700; cursor: pointer; }
.btn-add:disabled { opacity: .45; cursor: not-allowed; }
.pedir.sec { background: transparent; color: var(--acento); border: 1px solid var(--acento); }
.pedir.off { opacity: .45; pointer-events: none; }
.aviso-pedido { font-size: .85rem; color: var(--texto-suave); margin-top: 8px; }

/* Carrito */
.btn-carrito { position: fixed; right: 16px; bottom: 16px; z-index: 20; background: var(--acento); color: #fff; border: none;
  border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.panel-carrito { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); z-index: 30; background: var(--tarjeta);
  border-left: 1px solid var(--borde); box-shadow: -8px 0 24px rgba(0, 0, 0, .12); display: flex; flex-direction: column;
  transform: translateX(105%); visibility: hidden; transition: transform .25s, visibility 0s .25s; }
.panel-carrito.abierto { transform: none; visibility: visible; transition: transform .25s; }
.panel-carrito header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--borde); background: var(--cabecera); }
.panel-carrito h2 { font-size: 1.15rem; }
.x-cerrar, .x-item { background: none; border: none; font: inherit; font-size: 1.1rem; color: var(--texto-suave); cursor: pointer; padding: 4px 8px; }
.panel-carrito .lista { flex: 1; overflow-y: auto; padding: 12px 16px; display: grid; gap: 12px; align-content: start; }
.vacio-c { text-align: center; color: var(--texto-suave); padding: 40px 10px; }
.item-c { border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px; background: var(--fondo); }
.item-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-c .estado { display: inline-block; margin: 4px 0; }
.lineas-c { margin-top: 6px; font-size: .86rem; color: var(--texto-suave); display: grid; gap: 2px; }
.lin { display: flex; justify-content: space-between; gap: 10px; }
.item-pie { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.sub-c b { color: var(--acento); }
.cantidad.peq button { width: 28px; height: 30px; }
.panel-carrito footer { padding: 14px 16px; border-top: 1px solid var(--borde); display: grid; gap: 8px; }
.total-c { display: flex; justify-content: space-between; font-size: 1.1rem; }
.total-c b { color: var(--acento); font-size: 1.25rem; }
.btn-yappy:disabled { opacity: .45; cursor: not-allowed; }
.version { text-align: center; color: var(--texto-suave); font-size: .75rem; padding: 0 0 70px; }
.btn-yappy { background: #fff; color: var(--acento); border: 2px solid var(--acento); border-radius: 10px; padding: 10px; font: inherit; font-weight: 700; cursor: pointer; }
.link { background: none; border: none; color: var(--texto-suave); font: inherit; text-decoration: underline; cursor: pointer; padding: 4px; }
@media (min-width: 1100px) { body { transition: padding-right .25s; } body.carrito-abierto { padding-right: 380px; } }

/* Yappy */
#detalleYappy .aviso-pedido {
  margin-bottom: 16px;
}

#detalleYappy .pedir {
  display: block;
}
.total-yappy { margin: 8px 0 12px; font-size: 1.05rem; }
.total-yappy b { color: var(--acento); font-size: 1.3rem; }
.yappy-cuerpo { display: grid; justify-items: center; gap: 10px; }
.yappy-qr { width: 220px; max-width: 100%; border-radius: 12px; border: 1px solid var(--borde); }
.yappy-qr-vacio { width: 220px; height: 220px; display: grid; place-items: center; border: 2px dashed var(--borde); border-radius: 12px; color: var(--texto-suave); }
.yappy-num { text-align: center; }
.yappy-num small { display: block; color: var(--texto-suave); }
.yappy-num b { font-size: 1.4rem; letter-spacing: .02em; }

/* ===== Ajustes para teléfonos (pantallas verticales 9:16) ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { max-width: 100%; overflow-x: hidden; }   /* red de seguridad: nunca se mueve de lado */
img { max-width: 100%; }
button { -webkit-tap-highlight-color: transparent; }

/* Tarjetas: el precio y la etiqueta pueden pasar a otra línea en vez de ensanchar la página */
.articulo { min-width: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }   /* la foto siempre empieza arriba, aunque la fila tenga tarjetas de distinto alto */
.articulo .fila { margin-top: auto; padding-top: 4px; }
.articulo .nombre { overflow-wrap: anywhere; }
.articulo .fila { flex-wrap: wrap; row-gap: 4px; }
.articulo .estado { white-space: normal; text-align: center; line-height: 1.25; }
@media (hover: none) { .articulo:hover { transform: none; } }

/* Ventanas y textos largos */
dialog { max-height: 92vh; max-height: 92dvh; overscroll-behavior: contain; }
.detalle h2, .detalle p, .pz-datos, .lin span, .desglose span { overflow-wrap: anywhere; }
.pieza { grid-template-columns: auto 56px minmax(0, 1fr) auto; }
.yappy-qr, .yappy-qr-vacio { width: min(220px, 70vw); }
.yappy-qr-vacio { height: min(220px, 70vw); }

/* Carrito flotante y panel respetan las barras del teléfono */
.btn-carrito { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.panel-carrito footer { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.version { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 520px) {
  header { padding: 16px 12px 14px; }
  header img { height: 96px; }
  header h1 { font-size: 1.8rem; }
  header .lineas { margin-top: 6px; line-height: 1.4; }
  header .lineas p { font-size: .88rem; }
  header .lineas p:first-child { font-size: 1rem; }
  .enlaces { gap: 6px; margin-top: 10px; }
  .enlaces a { padding: 7px 12px; font-size: .85rem; }
  #topCarrito { display: none; }                      /* en el teléfono ya está el botón flotante del carrito */
  /* Categorías en una sola fila que se desliza con el dedo */
  .filtros { margin-top: 14px; gap: 6px; padding: 0 12px 6px; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtros button { flex: none; padding: 6px 12px; font-size: .9rem; white-space: nowrap; }
  .cuadricula { padding: 12px 12px 90px; }
  .articulo { padding: 8px 8px 12px; border-radius: 14px; }
  .articulo .nombre { font-size: .9rem; }
  .foto { border-radius: 10px; }
  dialog { width: calc(100vw - 24px); border-radius: 16px; }
  .detalle { padding: 14px 14px 20px; }
  .cantidad button { width: 40px; height: 40px; }
  .btn-add, .pedir, .btn-yappy, .cerrar { min-height: 44px; }
  .pedir { display: flex; align-items: center; justify-content: center; }
  #detalleYappy .pedir { display: flex; }
  .pieza { gap: 8px; padding: 8px; grid-template-columns: auto 48px minmax(0, 1fr) auto; }
  .pz-img { width: 48px; height: 48px; }
  .panel-carrito { width: 100vw; }
  .recibo { font-size: .76rem; padding: 10px 12px; }
}

/* Recibo */
.recibo { background: #fff; border: 1px dashed var(--acento); border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: .82rem; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 42vh; max-height: 42dvh; overflow-y: auto;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.r-tipo { display: grid; gap: 6px; margin: 10px 0; font-weight: 600; }
.r-tipo label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.r-tipo input { width: 18px; height: 18px; accent-color: var(--acento); }
.r-campo { display: block; font-weight: 600; margin-top: 10px; font-size: .92rem; }
.r-campo input, .r-campo textarea { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px;
  font: inherit; font-size: 16px; font-weight: 400; background: #fff; color: inherit; resize: vertical; }
.r-sec { display: flex; justify-content: center; gap: 18px; }
.lin span:last-child, .desglose span:last-child { white-space: nowrap; overflow-wrap: normal; flex: none; }
.item-pie .link { white-space: nowrap; }
.ped-lista:focus, .recibo:focus { outline: none; }
.ped-lista { display: grid; gap: 10px; margin-top: 10px; max-height: 50vh; max-height: 50dvh; overflow-y: auto; }
.articulo.resaltada { box-shadow: 0 0 0 3px var(--acento), 0 6px 20px rgba(138, 59, 78, .35); animation: pulso 1.1s ease-in-out 3; }
@keyframes pulso { 50% { transform: scale(1.03); } }
</style>
</head>

<body>

<header>
  <div id="marca"></div>
  <div class="lineas" id="lineas"></div>
  <div class="enlaces" id="enlaces"></div>
</header>

<nav class="filtros" id="filtros" aria-label="Categorías"></nav>
<main class="cuadricula" id="cuadricula"></main>

<dialog id="ventana"><div class="detalle" id="detalle"></div></dialog>

<button class="btn-carrito" id="btnCarrito" hidden></button>
<aside class="panel-carrito" id="panelCarrito" aria-label="Carrito de compras"></aside>
<dialog id="ventanaYappy"><div class="detalle" id="detalleYappy"></div></dialog>
<dialog id="ventanaRecibo"><div class="detalle" id="detalleRecibo"></div></dialog>
<dialog id="ventanaPedido"><div class="detalle" id="detallePedido"></div></dialog>

<script src="articulos.js"></script>
<script>
if (typeof AJUSTES === "undefined" || typeof ARTICULOS === "undefined" || typeof CATEGORIAS === "undefined") {
  document.body.insertAdjacentHTML("beforeend",
    '<p style="text-align:center;padding:40px">No se encontró articulos.js junto a index.html.</p>');
  throw new Error("Falta articulos.js");
}

/* Todo lo que se ve aquí se cambia desde editor.html (no hace falta tocar este código) */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const precio = n => AJUSTES.moneda + Number(n || 0).toFixed(2);
const dinero = n => Math.round(n * 100) / 100;
const { negocio, logo, lineas, instagram, whatsapp, broche } = AJUSTES;
const yappy = AJUSTES.yappy || {};

const cuadricula = document.getElementById("cuadricula");
const filtrosEl  = document.getElementById("filtros");
const ventana    = document.getElementById("ventana");
const detalle    = document.getElementById("detalle");
const nombresCat = CATEGORIAS.map(c => c.nombre);
const infoCat    = a => CATEGORIAS.find(c => c.nombre === a.categoria) || {};
const emojiDe    = a => infoCat(a).emoji || "📌";
const colorDe    = a => "var(--p" + ((Math.max(0, nombresCat.indexOf(a.categoria)) % 5) + 1) + ")";
const encargoPosible = a => !!(AJUSTES.encargo && AJUSTES.encargo.activo && a.encargo !== false && whatsapp);
const verMed     = a => !!(AJUSTES.mostrarMedidas && a.verMedidas !== false);
const esPack     = a => Array.isArray(a.piezas) && a.piezas.length > 0;
const cantPieza  = p => Math.max(0, Number(p.cantidad ?? 1) || 0);
const stockDe    = a => esPack(a) ? a.piezas.reduce((s, p) => s + cantPieza(p), 0) : (a.cantidad ?? 99);
const precioPieza = (a, p) => (p.precio !== undefined && p.precio !== null && p.precio !== "") ? Number(p.precio) : Number(a.precio || 0);
let filtro = "Todo";

function estado(a) {
  const c = stockDe(a);
  if (c <= 0) return { txt: encargoPosible(a) ? "Agotado · por encargo" : "Agotado", cls: "agotado" };
  if (c <= 3) return { txt: "Últimas " + c, cls: "pocas" };
  return { txt: "Disponible", cls: "disp" };
}

function fotoHTML(a) {
  const fondo = `background:${colorDe(a)}`;
  const e = esc(emojiDe(a));
  if (!a.imagen) return `<div class="foto" style="${fondo}">${e}</div>`;
  return `<div class="foto" style="${fondo}"><img src="${esc(a.imagen)}" alt="${esc(a.nombre)}" data-e="${e}"
          onerror="this.parentNode.textContent=this.dataset.e"></div>`;
}

function pintarFiltros() {
  filtrosEl.innerHTML = "";
  ["Todo", ...nombresCat].forEach(cat => {
    const c = CATEGORIAS.find(x => x.nombre === cat);
    const b = document.createElement("button");
    b.textContent = (c && c.emoji ? c.emoji + " " : "") + cat;
    if (cat === filtro) b.className = "activo";
    b.addEventListener("click", () => { filtro = cat; pintarFiltros(); pintarCuadricula(); });
    filtrosEl.appendChild(b);
  });
}

function pintarCuadricula() {
  cuadricula.innerHTML = "";
  ARTICULOS.forEach(a => {
    if (filtro !== "Todo" && a.categoria !== filtro) return;
    const e = estado(a);
    const boton = document.createElement("button");
    boton.className = "articulo" + (e.cls === "agotado" ? " sin-stock" : "");
    boton.dataset.nombre = a.nombre;
    boton.innerHTML = `${fotoHTML(a)}
      <div class="nombre">${esc(a.nombre)}</div>
      ${esPack(a) ? '<div class="sub">📦 Pack · elige tus pines</div>' : ""}
      <div class="fila"><span class="precio">${precio(a.precio)}${esPack(a) ? " c/u" : ""}</span><span class="estado ${e.cls}">${e.txt}</span></div>`;
    boton.addEventListener("click", () => abrir(a));
    cuadricula.appendChild(boton);
  });
  if (!cuadricula.children.length) cuadricula.innerHTML = '<p class="vacio">Aún no hay artículos en esta categoría.</p>';
}

/* ---------- Cálculo de precios (lo usan la ventana del pin y el carrito) ---------- */
function calcular(it) {
  const a = ARTICULOS.find(x => x.nombre === it.nombre);
  if (!a) return null;
  const pe = AJUSTES.encargo || {};
  const lineas = [];
  let unidades, subtotal;
  if (esPack(a) && Array.isArray(it.piezas)) {
    const sel = it.piezas.filter(i => a.piezas[i]);
    if (!sel.length) return null;
    unidades = sel.length;
    const usaPack = sel.length === a.piezas.length && Number(a.precioPack) > 0;
    subtotal = usaPack ? Number(a.precioPack) : sel.reduce((s, i) => s + precioPieza(a, a.piezas[i]), 0);
    sel.forEach(i => {
      const p = a.piezas[i];
      lineas.push({ t: p.nombre + (verMed(a) && p.medidas ? ` (${p.medidas})` : ""), v: usaPack ? "" : precio(precioPieza(a, p)) });
    });
    if (usaPack) lineas.push({ t: "Precio por llevar todo el pack", v: precio(subtotal) });
  } else {
    if (esPack(a)) return null;
    unidades = it.cant || 1;
    subtotal = Number(a.precio || 0) * unidades;
    lineas.push({ t: `${unidades} × ${a.nombre}`, v: precio(subtotal) });
  }
  const cargoU = Number(pe.cargo) || 0;
  const cargo = it.modo === "encargo" ? (pe.modo === "pedido" ? cargoU : cargoU * unidades) : 0;
  if (cargo > 0) lineas.push({ t: "Cargo por pedido especial", v: precio(cargo) });
  const extra = Number(broche && broche.precio) || 0;
  const nb = it.nb || 0;
  if (nb > 0) lineas.push({ t: `${nb} broche${nb > 1 ? "s" : ""} de seguridad`, v: extra > 0 ? precio(extra * nb) : "" });
  return { a, lineas, unidades, subtotal, cargo, nb, total: dinero(subtotal + cargo + extra * nb) };
}

function codigoPedido() {
  const d = new Date();
  return "JP-" + String(d.getDate()).padStart(2, "0") + String(d.getMonth() + 1).padStart(2, "0") + "-" + Math.random().toString(36).slice(2, 5).toUpperCase();
}
/* Texto sencillo para WhatsApp: sin emojis ni símbolos raros (se pueden ver como «?» en algunos equipos) */
const plano = t => String(t ?? "")
  .replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{2BFF}\u{FE0F}\u200D]/gu, "")
  .replace(/[×✕]/g, "x").replace(/[’‘´`]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/…/g, "...")
  .replace(/\s{2,}/g, " ").trim();

/* ---------- Enlace que reconstruye el pedido en el catálogo ---------- */
const hashTxt = (s, n) => { let h = 2166136261; const t = normTxt(s); for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).padStart(7, "0").slice(-n); };
function codificarPedido(items) {
  return items.map(it => {
    const a = ARTICULOS.find(x => x.nombre === it.nombre);
    if (!a) return null;
    const cuerpo = it.piezas ? it.piezas.map(i => a.piezas[i] ? hashTxt(a.piezas[i].nombre, 4) : "").filter(Boolean).join(".") : String(it.cant || 1);
    return [hashTxt(a.nombre, 5), it.modo === "encargo" ? "e" : "n", cuerpo, it.nb || 0].join("_");
  }).filter(Boolean).join("~");
}
const enlacePedido = items => location.href.split("#")[0] + "#pedido=" + codificarPedido(items);
function decodificarPedido(txt) {
  return txt.split("~").map(seg => {
    const [h, m, cuerpo = "", nb] = seg.split("_");
    const a = ARTICULOS.find(x => hashTxt(x.nombre, 5) === h);
    if (!a) return { faltante: true };
    const it = { nombre: a.nombre, modo: m === "e" ? "encargo" : "normal", nb: Number(nb) || 0 };
    if (esPack(a)) {
      const hs = cuerpo.split(".").filter(Boolean);
      it.piezas = hs.map(ph => a.piezas.findIndex(p => hashTxt(p.nombre, 4) === ph)).filter(i => i >= 0);
      it.piezasPedidas = hs.length;
    } else it.cant = Math.max(1, Number(cuerpo) || 1);
    return it;
  });
}

/* Recibo en texto para WhatsApp: cada dato en su renglón (los *asteriscos* se ven en negrita en WhatsApp) */
function mensajePedido(items, tipo = "pedido", extra = {}) {
  const cs = items.map(it => ({ it, c: calcular(it) })).filter(x => x.c);
  const SEP = "-----------------------";
  const total = dinero(cs.reduce((s, x) => s + x.c.total, 0));
  const hayEnc = cs.some(x => x.it.modo === "encargo");
  const tiempo = AJUSTES.encargo && AJUSTES.encargo.tiempo ? " - " + AJUSTES.encargo.tiempo : "";
  const titulo = tipo === "yappy" ? "PAGO CON YAPPY" : tipo === "cotizacion" ? "COTIZACION" : "PEDIDO";
  const L = [`*${titulo} - ${plano(negocio)}*`, "Fecha: " + new Date().toLocaleString("es", { dateStyle: "short", timeStyle: "short" })];
  if (extra.ref) L.push("Ref: " + extra.ref);
  if (extra.nombre) L.push("Cliente: " + plano(extra.nombre));
  L.push(SEP, "");
  cs.forEach(({ it, c }, i) => {
    const a = c.a;
    L.push(`*${i + 1}) ${plano(a.nombre)}*`);
    if (it.piezas) c.lineas.forEach(l => L.push(`- ${plano(l.t)}${l.v ? ": " + l.v : ""}`));
    else {
      L.push(`- ${c.unidades} x ${precio(a.precio)}: ${precio(c.subtotal)}`);
      c.lineas.slice(1).forEach(l => L.push(`- ${plano(l.t)}${l.v ? ": " + l.v : ""}`));
    }
    L.push(it.modo === "encargo" ? `Pedido especial (agotado)${tiempo}` : "Disponible");
    L.push(`Subtotal: *${precio(c.total)}*`, "");
  });
  L.push(SEP, `*TOTAL: ${precio(total)}*`);
  if (hayEnc) L.push("_Incluye cargo por pedido especial._");
  L.push("");
  if (tipo === "yappy") L.push(`Ya pagué ${precio(total)} con Yappy. Te envío el comprobante.`);
  else if (tipo === "cotizacion") L.push("Solo quiero saber el precio final y si está disponible. ¡Gracias!");
  else L.push(hayEnc ? "¿Cuánto tardaría el pedido especial? ¡Gracias!" : "¿Está disponible? ¡Gracias!");
  if (extra.nota) L.push("", "Mensaje: " + plano(extra.nota));
  if (!extra.sinEnlace && cs.length) L.push("", "Ver este pedido en el catalogo:", enlacePedido(cs.map(x => x.it)));
  return L.join("\n");
}

      return `<label class="pieza${libre ? "" : " off"}" data-i="${i}">
        <input type="checkbox" data-i="${i}"${libre ? "" : " disabled"}>
        <span class="pz-img" style="background:${colorDe(a)}">${img}<i class="visto">✓</i></span>
        <span class="pz-datos"><b>${esc(p.nombre)}</b>${verMed(a) && p.medidas ? `<small>📏 ${esc(p.medidas)}</small>` : ""}${nota ? `<small>${nota}</small>` : ""}</span>
        <span class="pz-precio">${precio(precioPieza(a, p))}</span>
      </label>`;
    }).join("")}
    </div>
    <label class="todos"><input type="checkbox" id="chkTodos"> Seleccionar todos</label>`;

  detalle.innerHTML = `${fotoHTML(a)}
    <div class="meta"><span class="cat">${esc((cat.emoji ? cat.emoji + " " : "") + (a.categoria || ""))}</span><span class="estado ${e.cls}">${e.txt}</span></div>
    <h2>${esc(a.nombre)}</h2>
    <div class="precio">${precio(a.precio)}${esP ? " c/u" : ""}</div>
    <p>${esc(a.descripcion)}</p>
    ${medidas}
    ${piezasHTML}
    <div id="pedido"></div>
    <button class="cerrar" id="cerrar">Cerrar</button>`;
  document.getElementById("cerrar").addEventListener("click", () => ventana.close());

  const ped = document.getElementById("pedido");
  if (puedeComprar && !quedaAlgo && stock > 0) {
    ped.innerHTML = '<p class="aviso-pedido">Ya tienes en tu carrito todo lo disponible de este artículo.</p>';
  } else if (puedeComprar && quedaAlgo) {
    const tiempo = pe.tiempo ? ` Tiempo estimado: ${esc(pe.tiempo)}.` : "";
    ped.innerHTML = `
      ${esEncargo ? `<div class="encargo"><b>📦 Agotado, pero puedes encargarlo</b><p>${esc(pe.texto || "")}${tiempo}</p></div>` : ""}
      ${conBroche ? `<div class="broche${hayBroche ? "" : " off"}">
        <label><input type="checkbox" id="chk"${hayBroche ? "" : " disabled"}>
          <span><b>Agregar broche de seguridad${extra > 0 ? " (+" + precio(extra) + " c/u)" : ""}</b><br><small>${esc(broche.texto)}</small></span></label>
        ${textoB ? `<span class="estado ${clsB}">${textoB}</span>` : ""}
        <div class="cantb" id="cantb" hidden>Broches:
          <div class="cantidad"><button id="menosb" aria-label="Menos broches">−</button><span id="nb">1</span><button id="masb" aria-label="Más broches">+</button></div>
        </div>
      </div>` : ""}
      <div class="desglose" id="desglose"></div>
      <div class="total" id="total"></div>
      ${esP ? "" : `<div class="acciones"><span>Cantidad</span><div class="cantidad"><button id="menos" aria-label="Menos">−</button><span id="cant">1</span><button id="mas" aria-label="Más">+</button></div></div>`}
      <div class="acciones-col">
        ${usaCarrito ? '<button class="btn-add" id="btnAdd">🛒 Agregar al carrito</button>' : ""}
        ${whatsapp ? `<a class="pedir${usaCarrito ? " sec" : ""}" id="pedir" target="_blank" rel="noopener">${esEncargo ? "Encargar solo esto por WhatsApp" : "Pedir solo esto por WhatsApp"}</a>` : ""}
        ${yappy.activo ? '<button class="btn-yappy" id="btnYappyItem">💛 Pagar con Yappy</button>' : ""}
      </div>
      <div class="aviso-pedido" id="avisoPedido"></div>`;

    const chk = document.getElementById("chk");
    const btnAdd = document.getElementById("btnAdd");
    const lnkPedir = document.getElementById("pedir");
    const btnYI = document.getElementById("btnYappyItem");
    const itemActual = () => esP
      ? { nombre: a.nombre, modo, piezas: [...sel].sort((x, y) => x - y), nb }
      : { nombre: a.nombre, modo, cant, nb };

    const actualizar = () => {
      const con = !!(chk && chk.checked);
      if (con) { if (!nbManual) nb = 1; nb = Math.min(Math.max(1, nb), stockB); } else nb = 0;
      if (chk) { document.getElementById("cantb").hidden = !con; document.getElementById("nb").textContent = nb; }
      if (esP) {
        const cont = document.getElementById("piezas");
        cont.classList.toggle("hay-sel", sel.size > 0);
        cont.querySelectorAll(".pieza").forEach(l => l.classList.toggle("sel", sel.has(Number(l.dataset.i))));
        const libres = a.piezas.map((p, i) => i).filter(i => libreP(a.piezas[i], i));
        const todos = document.getElementById("chkTodos");
        todos.disabled = !libres.length;
        todos.checked = libres.length > 0 && libres.every(i => sel.has(i));
        todos.indeterminate = sel.size > 0 && !todos.checked;
      } else document.getElementById("cant").textContent = cant;
      const c = (esP && !sel.size) ? null : calcular(itemActual());
      document.getElementById("total").textContent = "Total: " + precio(c ? c.total : 0);
      document.getElementById("desglose").innerHTML = (c && (esP || c.lineas.length > 1))
        ? c.lineas.map(l => `<div><span>${esc(l.t)}</span><span>${l.v || ""}</span></div>`).join("") : "";
      if (btnAdd) btnAdd.disabled = !c;
      if (btnYI) btnYI.disabled = !c;
      if (lnkPedir) {
        lnkPedir.classList.toggle("off", !c);
        if (c) lnkPedir.href = urlWsp(mensajePedido([itemActual()])); else lnkPedir.removeAttribute("href");
      }
      document.getElementById("avisoPedido").textContent = c ? "" : "Elige al menos un pin para continuar.";
    };

    if (esP) {
      document.getElementById("piezas").addEventListener("change", ev => {
        const i = Number(ev.target.dataset.i);
        if (ev.target.checked) sel.add(i); else sel.delete(i);
        actualizar();
      });
      document.getElementById("chkTodos").addEventListener("change", ev => {
        a.piezas.forEach((p, i) => { if (libreP(p, i)) { if (ev.target.checked) sel.add(i); else sel.delete(i); } });
        document.querySelectorAll("#piezas input[type=checkbox]:not(:disabled)").forEach(x => { x.checked = ev.target.checked; });
        actualizar();
      });
    } else {
      document.getElementById("menos").addEventListener("click", () => { if (cant > 1) { cant--; actualizar(); } });
      document.getElementById("mas").addEventListener("click", () => { if (cant < maxCant) { cant++; actualizar(); } });
    }
    if (chk) {
      chk.addEventListener("change", () => { nbManual = false; actualizar(); });
      document.getElementById("menosb").addEventListener("click", () => { nb--; nbManual = true; actualizar(); });
      document.getElementById("masb").addEventListener("click", () => { nb++; nbManual = true; actualizar(); });
    }
    if (btnYI) btnYI.addEventListener("click", () => { if (!(esP && !sel.size)) abrirYappy([itemActual()]); });
    if (btnAdd) btnAdd.addEventListener("click", () => {
      if (esP && !sel.size) return;
      agregarAlCarrito(itemActual());
      ventana.close();
    });
    actualizar();
  }
  ventana.showModal();
}

ventana.addEventListener("click", e => { if (e.target === ventana) ventana.close(); });

/* ---------- Inventario desde una hoja de cálculo (Google Sheets publicada como CSV) ---------- */
const normTxt = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const NOMBRES_BROCHE = ["broche de seguridad", "broche", "broches"];
function parseCSV(t) {
  const filas = []; let fila = [], celda = "", comillas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (comillas) {
      if (c === '"') { if (t[i + 1] === '"') { celda += '"'; i++; } else comillas = false; }
      else celda += c;
    } else if (c === '"') comillas = true;
    else if (c === ",") { fila.push(celda); celda = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else celda += c;
  }
  if (celda !== "" || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}
function aNumero(v) {
  if (v == null) return null;
  let s = String(v).replace(/[^\d.,-]/g, "");
  if (s === "" || s === "-") return null;
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, "");
  else if (s.includes(",")) s = s.replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
async function leerHoja(url) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("respuesta " + r.status);
    const filas = parseCSV(await r.text()).filter(f => f.some(c => c.trim() !== ""));
    if (!filas.length) throw new Error("la hoja está vacía");
    const cab = filas[0].map(normTxt);
    const col = alias => cab.findIndex(h => alias.includes(h));
    const iN = col(["nombre", "articulo", "producto", "pin"]);
    const iC = col(["cantidad", "stock", "existencias", "quedan", "disponibles"]);
    const iP = col(["precio", "precio de venta", "precio venta", "pvp"]);
    if (iN < 0) throw new Error("no encontré una columna llamada «nombre»");
    const datos = filas.slice(1)
      .map(f => ({ nombre: (f[iN] || "").trim(), cantidad: iC >= 0 ? aNumero(f[iC]) : null, precio: iP >= 0 ? aNumero(f[iP]) : null }))
      .filter(x => x.nombre);
    return { datos, columnas: { cantidad: iC >= 0, precio: iP >= 0 } };
  } catch (err) {
    throw new Error(err.name === "AbortError" ? "tardó demasiado en responder" : err.message);
  } finally { clearTimeout(t); }
}
function aplicarHoja(res, articulos, ajustes) {
  // Filas de la hoja: «Artículo» o «Pack | Pieza» (las de pieza llevan una barra vertical)
  const mapa = new Map();
  const filasPieza = [];
  res.datos.forEach(x => {
    const i = x.nombre.indexOf("|");
    if (i > 0) filasPieza.push({ pack: normTxt(x.nombre.slice(0, i)), pieza: normTxt(x.nombre.slice(i + 1)), x });
    else mapa.set(normTxt(x.nombre), x);
  });
  let coinciden = 0;
  articulos.forEach(a => {
    const x = mapa.get(normTxt(a.nombre));
    const esPk = Array.isArray(a.piezas) && a.piezas.length > 0;
    if (x) {
      coinciden++;
      if (x.cantidad != null && !esPk) a.cantidad = Math.max(0, Math.floor(x.cantidad)); // en packs, la cantidad sale de sus piezas
      if (x.precio != null && x.precio >= 0) a.precio = x.precio;
    }
    if (esPk) filasPieza.forEach(f => {
      if (f.pack !== normTxt(a.nombre)) return;
      const p = a.piezas.find(q => normTxt(q.nombre) === f.pieza);
      if (!p) return;
      if (f.x.cantidad != null) p.cantidad = Math.max(0, Math.floor(f.x.cantidad));
      if (f.x.precio != null && f.x.precio >= 0) p.precio = f.x.precio;
    });
  });
  const b = NOMBRES_BROCHE.map(n => mapa.get(n)).find(Boolean);
  if (b && b.cantidad != null && ajustes.broche) ajustes.broche.cantidad = Math.max(0, Math.floor(b.cantidad));
  return coinciden;
}

async function sincronizarHoja() {
  if (!AJUSTES.hojaUrl) return false;
  try { aplicarHoja(await leerHoja(AJUSTES.hojaUrl), ARTICULOS, AJUSTES); return true; }
  catch (err) { console.warn("No se pudo leer la hoja de inventario:", err.message); return false; }
}
const refrescar = () => { pintarCuadricula(); pintarCarrito(false); };

document.body.insertAdjacentHTML("beforeend", `<p class="version">Catálogo ${VERSION}</p>`);
console.info("Jogopines catálogo", VERSION);
pintarFiltros();

  cuadricula.innerHTML = '<p class="vacio">Cargando inventario…</p>';
  let listo = false;
  const p = sincronizarHoja().then(ok => { listo = true; return ok; });
  Promise.race([p, new Promise(r => setTimeout(r, 2500))]).then(() => {
    refrescar();
    procesarPedidoEnlace();
    if (!listo) p.then(ok => { if (ok) refrescar(); });
  });
} else { refrescar(); procesarPedidoEnlace(); }
